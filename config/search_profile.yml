profile_name: "Kristin Robertshaw — scientific design & animation profile"
profile_status: "personalized_ready"

target_summary: >-
  Senior-level conceptual designer, scientific animator, and digital/marketing designer
  with nearly 20 years translating complex scientific and technical subjects into visual
  stories. Strongest fit is in life-sciences, biotech, genomics, scientific/medical
  visualization, product visualization, motion/3D, and technical marketing. Prioritize
  concept/storyboard work, 3D animation, motion graphics, digital campaign creative,
  product launches, scientific conference materials, presentation systems, and regulated
  marketing communications.

resume_strengths:
  - "Concept development and storyboarding for scientific and medical animation"
  - "3D scientific animation, product visualization, modeling and rendering"
  - "Cinema 4D and Redshift"
  - "Adobe After Effects and Premiere Pro"
  - "Senior digital/corporate marketing design in life sciences"
  - "5,000+ marketing assets across 2,000+ campaigns"
  - "15+ commercial product launches"
  - "125+ scientific conference activations"
  - "Reusable template and presentation systems"
  - "Packaging, labeling and production-accurate 3D product renderings"
  - "Regulated marketing and brand compliance"
  - "Cross-functional communication of complex scientific technology"

